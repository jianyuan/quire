# Builds the release binaries. CI runs it on v* tags. Locally,
# `make dist` builds a snapshot into dist/ without publishing.
version: 2

project_name: quire

builds:
  - main: ./cmd/quire
    binary: quire
    env:
      - CGO_ENABLED=0
    flags:
      - -trimpath
    ldflags:
      - -s -w
    goos: [darwin, linux, windows]
    goarch: [amd64, arm64]

archives:
  - formats: [tar.gz]
    format_overrides:
      - goos: windows
        formats: [zip]
    files:
      - LICENSE
      - README.md
      - THIRD_PARTY_NOTICES.md

checksum:
  name_template: SHA256SUMS

changelog:
  use: github
  sort: asc

# Publishes a cask to github.com/jianyuan/homebrew-tap, so people can run
# `brew install --cask jianyuan/tap/quire`. The release workflow's own token
# can't write to another repository, so this needs a personal access token
# in the HOMEBREW_TAP_GITHUB_TOKEN secret.
homebrew_casks:
  - name: quire
    binaries: [quire]
    repository:
      owner: jianyuan
      name: homebrew-tap
      token: "{{ .Env.HOMEBREW_TAP_GITHUB_TOKEN }}"
    directory: Casks
    homepage: https://github.com/jianyuan/quire
    description: Reader for folders of Markdown files
    commit_msg_template: "Update quire to {{ .Tag }}"
    # The binaries aren't signed with an Apple Developer ID, so macOS would
    # block them on first run. Removing the quarantine flag lets them start.
    hooks:
      post:
        install_steps: |
          on_macos do
            run "/usr/bin/xattr", args: ["-dr", "com.apple.quarantine", "{{ .StagedPath }}/quire"]
          end
