<!doctype html>
<html lang="en-GB">
    <head>
        <meta charset="utf-8" />
        <meta
            name="viewport"
            content="width=device-width, initial-scale=1, viewport-fit=cover"
        />
        <title>Quire</title>
        <script>
            // Apply the saved theme before the first paint; main.tsx deferring would flash the system one.
            try {
                const t = JSON.parse(localStorage.getItem("quire.settings"))?.theme;
                if (t && t !== "auto") document.documentElement.dataset.reader = t;
            } catch {}
        </script>
        <link rel="stylesheet" href="/src/style.css" />
        <script type="module" src="/src/main.tsx"></script>
    </head>
    <body>
        <div id="app"></div>
    </body>
</html>
