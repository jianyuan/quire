name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - uses: pnpm/action-setup@v6
        with:
          package_json_file: web/package.json

      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml

      - name: Vet and format-check Go
        run: make check

      # web/dist is committed so `go run` works without Node.js; fail if
      # someone changed web/ without rebuilding it.
      - name: Check web/dist is up to date
        run: make check-web

      - name: Build
        run: make build

      - name: Smoke test
        run: |
          ./bin/quire -addr 127.0.0.1:8080 . &
          sleep 1
          curl -fsS http://127.0.0.1:8080/ | grep -q '<title>Quire</title>'
          curl -fsS http://127.0.0.1:8080/api/tree | grep -q README.md
          curl -fsS http://127.0.0.1:8080/licenses | grep -q 'MIT'
